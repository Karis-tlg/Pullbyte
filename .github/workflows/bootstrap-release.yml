name: Bootstrap verified release

on:
  push:
    branches:
      - agent/publish-release

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Assemble exact release
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk* > /tmp/release.b64
          base64 -d /tmp/release.b64 > /tmp/release.zip
          echo "40c822ed6d7b302e16d32ce81f3c9d6197fdf7319edfece06f9335498b222e5d  /tmp/release.zip" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/release.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: assemble verified release"
          git push
